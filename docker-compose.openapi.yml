version: '3.9'

services:
  postgres_prod:
    image: postgres:16
    container_name: edi_postgres_prod
    environment:
      POSTGRES_USER: edi
      POSTGRES_PASSWORD: edi
      POSTGRES_DB: edi_prod
    ports:
      - '5433:5432'
    volumes:
      - pg_prod_data:/var/lib/postgresql/data

  postgres_sandbox:
    image: postgres:16
    container_name: edi_postgres_sandbox
    environment:
      POSTGRES_USER: edi
      POSTGRES_PASSWORD: edi
      POSTGRES_DB: edi_sandbox
    ports:
      - '5434:5432'
    volumes:
      - pg_sandbox_data:/var/lib/postgresql/data

  api_prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edi_api_prod
    depends_on:
      - postgres_prod
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://edi:edi@postgres_prod:5432/edi_prod
      AUTH_SECRET: change-me-prod
      CORS_ORIGINS: http://localhost:3000
      OAUTH_ADMIN_KEY: prod-admin-key
      OAUTH_ENABLE_API_KEY_FALLBACK: 'false'
      API_DAILY_QUOTA: '20000'
      API_MONTHLY_QUOTA: '300000'
      API_MAX_REQUEST_SIZE_BYTES: '5242880'
      API_IP_ALLOWLIST:
      LOCAL_STORAGE_PATH: /app/storage
      PLATFORM_VERSION: 1.0.0-prod
    ports:
      - '8000:8000'
    volumes:
      - api_prod_storage:/app/storage

  api_sandbox:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edi_api_sandbox
    depends_on:
      - postgres_sandbox
    environment:
      APP_ENV: sandbox
      DATABASE_URL: postgresql://edi:edi@postgres_sandbox:5432/edi_sandbox
      AUTH_SECRET: change-me-sandbox
      CORS_ORIGINS: http://localhost:3000
      OAUTH_ADMIN_KEY: sandbox-admin-key
      OAUTH_ENABLE_API_KEY_FALLBACK: 'true'
      INTEGRATION_API_KEYS: dev-integration-key
      API_DAILY_QUOTA: '50000'
      API_MONTHLY_QUOTA: '500000'
      API_MAX_REQUEST_SIZE_BYTES: '5242880'
      API_IP_ALLOWLIST:
      LOCAL_STORAGE_PATH: /app/storage
      PLATFORM_VERSION: 1.0.0-sandbox
    ports:
      - '8001:8000'
    volumes:
      - api_sandbox_storage:/app/storage

volumes:
  pg_prod_data:
  pg_sandbox_data:
  api_prod_storage:
  api_sandbox_storage:
