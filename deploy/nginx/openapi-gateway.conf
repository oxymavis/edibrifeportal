# OpenAPI Gateway Template (Nginx OSS)
# Target topology:
# - prod API:    http://127.0.0.1:8000
# - sandbox API: http://127.0.0.1:8001
#
# Use this as a baseline and adjust domain names, TLS certs, allowlist, and rate limits.

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # Basic structured access logs with upstream latency.
  log_format openapi_json escape=json
    '{"ts":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$request_id",'
    '"host":"$host","method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"referer":"$http_referer","ua":"$http_user_agent",'
    '"rt":$request_time,"urt":"$upstream_response_time","uaddr":"$upstream_addr"}';

  access_log /var/log/nginx/openapi_access.log openapi_json;
  error_log  /var/log/nginx/openapi_error.log warn;

  # Request size guard (align with backend API_MAX_REQUEST_SIZE_BYTES).
  client_max_body_size 5m;

  # Read/Write timeout guards.
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;
  send_timeout 30s;

  # Rate limits by source IP. Adjust to your SLA and client onboarding policy.
  limit_req_zone $binary_remote_addr zone=global_per_ip:20m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=oauth_per_ip:10m rate=5r/s;

  # Optional allowlist. Keep only trusted CIDRs in production.
  geo $allow_openapi {
    default 0;
    127.0.0.1/32 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
    # Example office/public CIDR:
    # 203.0.113.0/24 1;
  }

  # Map for websocket upgrade support.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream edi_api_prod {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  upstream edi_api_sandbox {
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  # Common proxy headers
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Upgrade $http_upgrade;

  # Production gateway
  server {
    listen 80;
    server_name api.example.com;

    # In production replace with TLS server block and redirect 80->443.
    # return 301 https://$host$request_uri;

    # IP allowlist gate for all OpenAPI traffic.
    if ($allow_openapi = 0) {
      return 403;
    }

    # Health and docs are still gated by allowlist here by design.
    location / {
      limit_req zone=global_per_ip burst=40 nodelay;
      proxy_pass http://edi_api_prod;
    }

    # Tighten OAuth token endpoint to reduce brute-force attempts.
    location = /v1/oauth/token {
      limit_req zone=oauth_per_ip burst=10 nodelay;
      proxy_pass http://edi_api_prod;
    }

    # Optional: explicit path for external integrations ingress.
    location /v1/integrations/events {
      limit_req zone=global_per_ip burst=20 nodelay;
      proxy_pass http://edi_api_prod;
    }
  }

  # Sandbox gateway
  server {
    listen 80;
    server_name sandbox-api.example.com;

    if ($allow_openapi = 0) {
      return 403;
    }

    location / {
      limit_req zone=global_per_ip burst=60 nodelay;
      proxy_pass http://edi_api_sandbox;
    }

    location = /v1/oauth/token {
      limit_req zone=oauth_per_ip burst=20 nodelay;
      proxy_pass http://edi_api_sandbox;
    }
  }
}
